name: EDGEMAKER Daily Pipeline

on:
  schedule:
    # 6:15am AEST = 8:15pm UTC
    - cron: '15 20 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests pytz anthropic scipy

      - name: Run EDGEMAKER pipeline
        env:
          ODDS_API_KEY:      ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY:       ${{ secrets.BDL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python model.py

      - name: Commit results
        run: |
          git config user.name "edgemaker-bot"
          git config user.email "bot@edgemaker"
          git add data/results.json
          git diff --staged --quiet || git commit -m "Daily update: $(TZ='Australia/Melbourne' date +'%Y-%m-%d %H:%M AEST')"
          git push
