name: Edgemaker Daily Pipeline

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip3 install requests pandas numpy scikit-learn xgboost joblib python-dotenv anthropic

      - name: Debug — show phase1 lines 40-45
        run: sed -n '40,45p' phase1_data_pipeline.py

      - name: Phase 1 — Pull NBA + odds data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python3 phase1_data_pipeline.py

      - name: Phase 5c — Line snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 phase5c_line_movement.py

      - name: Phase 5e — Full signal pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 phase5e_orchestrator.py

      - name: Phase 6 — Claude AI reasoning
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 phase6_claude_enrichment.py
        
     - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Edgemaker Bot"
          git add dashboard/data/results.json
          git diff --staged --quiet || git commit -m "Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ajamescarey-debug/Edgemaker.git main

      - name: Done
        run: echo "Pipeline complete at $(date -u)"
